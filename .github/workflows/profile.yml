name: Refresh profile

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'
      - 'assets/fonts/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read public activity from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: jesusjodar
        run: python scripts/update_activity.py
      - name: Render and validate profile
        run: |
          python scripts/render_profile.py
          python -m unittest discover -s tests -v
      - name: Commit refreshed activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public GitHub activity'
            git push
          fi
